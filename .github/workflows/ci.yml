name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  test:
    name: tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04   # ffmpeg 6.1
            python: "3.8"      # oldest Python the scripts support
          - os: ubuntu-24.04
            python: "3.13"
          - os: ubuntu-22.04   # ffmpeg 4.4: exercises the old-ffmpeg fallbacks
            python: "3.10"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install ffmpeg
        run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg && ffmpeg -version | head -1
      - name: Run tests
        run: uv run --no-project --python ${{ matrix.python }} --with-requirements requirements-dev.txt pytest tests -q

  repo-checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Rule copies in sync with AGENTS.md
        run: python3 tools/sync_rules.py --check
      - name: Manifests are valid JSON
        run: for f in plugin.json .claude-plugin/*.json .codex-plugin/plugin.json .agents/plugins/marketplace.json; do python3 -m json.tool "$f" > /dev/null && echo "ok $f"; done
