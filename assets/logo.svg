<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="reelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF512F" />
      <stop offset="50%" stop-color="#DD2476" />
      <stop offset="100%" stop-color="#8E2DE2" />
    </linearGradient>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4A00E0" />
      <stop offset="100%" stop-color="#8E2DE2" />
    </linearGradient>
  </defs>
  
  <!-- Outer rounded background frame with 10% padding (26px padding inside 256px) -->
  <rect x="26" y="26" width="204" height="204" rx="44" fill="url(#reelGrad)" opacity="0.12" />
  
  <!-- Film strip / Reel background motif -->
  <path d="M48 64 C48 55.16 55.16 48 64 48 L104 48 C112.84 48 120 55.16 120 64 L120 192 C120 200.84 112.84 208 104 208 L64 208 C55.16 208 48 200.84 48 192 Z" fill="#202124" opacity="0.85" />
  
  <!-- Film sprockets -->
  <rect x="56" y="60" width="12" height="16" rx="3" fill="#FFFFFF" opacity="0.9" />
  <rect x="56" y="88" width="12" height="16" rx="3" fill="#FFFFFF" opacity="0.9" />
  <rect x="56" y="116" width="12" height="16" rx="3" fill="#FFFFFF" opacity="0.9" />
  <rect x="56" y="144" width="12" height="16" rx="3" fill="#FFFFFF" opacity="0.9" />
  <rect x="56" y="172" width="12" height="16" rx="3" fill="#FFFFFF" opacity="0.9" />

  <rect x="100" y="60" width="12" height="16" rx="3" fill="#FFFFFF" opacity="0.9" />
  <rect x="100" y="88" width="12" height="16" rx="3" fill="#FFFFFF" opacity="0.9" />
  <rect x="100" y="116" width="12" height="16" rx="3" fill="#FFFFFF" opacity="0.9" />
  <rect x="100" y="144" width="12" height="16" rx="3" fill="#FFFFFF" opacity="0.9" />
  <rect x="100" y="172" width="12" height="16" rx="3" fill="#FFFFFF" opacity="0.9" />

  <!-- 9:16 Vertical Smartphone / Reel overlay -->
  <rect x="116" y="38" width="94" height="168" rx="18" fill="url(#reelGrad)" stroke="#FFFFFF" stroke-width="4" />
  
  <!-- Screen content area -->
  <rect x="122" y="48" width="82" height="146" rx="12" fill="#121212" />

  <!-- Play button icon in the screen -->
  <polygon points="156,108 176,121 156,134" fill="#FFFFFF" />

  <!-- Social sound wave / captions bars at the bottom of the screen -->
  <rect x="134" y="158" width="30" height="4" rx="2" fill="#FFFFFF" opacity="0.8" />
  <rect x="134" y="166" width="58" height="4" rx="2" fill="#FFFFFF" opacity="0.5" />
  <rect x="134" y="174" width="44" height="4" rx="2" fill="#FFFFFF" opacity="0.5" />

  <!-- Heart / Like badge -->
  <circle cx="188" cy="74" r="12" fill="#FF2A6D" />
  <path d="M188 78 L183.5 73.5 C181.8 71.8 181.8 69.2 183.5 67.5 C185.2 65.8 187.8 65.8 189.5 67.5 L188 69 L186.5 67.5 C188.2 65.8 190.8 65.8 192.5 67.5 C194.2 69.2 194.2 71.8 192.5 73.5 Z" fill="#FFFFFF" transform="translate(-1, 0.5) scale(0.9)" />
</svg>
