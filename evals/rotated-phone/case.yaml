schema_version: "1.0"
name: rotated-phone
description: Rotated phone footage; outputs must use the display orientation (1080x1920), not the coded size.
tags: [rotation]
runs: 2
context:
  scaffold_script: scaffold.sh
execution:
  prompt: |
    /video-to-social-content phone.mp4 — just one 3:4 photo carousel of 3 stills, no reels.
  max_turns: 40
  timeout_seconds: 900
  allowed_tools: [Bash, Read, Write, Edit, Glob, Grep, Skill]
graders:
  - type: file_exists
    name: verified
    path: outputs/phone/verify_report.json
  - type: regex
    name: verify-passed
    target: {source: file, path: outputs/phone/verify_report.json}
    pattern: "\"ok\": true"
  - type: regex
    name: display-size-photo
    pattern: "1080\\s*[x×]\\s*1440"
  - type: llm
    name: correct-orientation
    criteria: |
      The reply delivers 3 photos at 1080x1440 (3:4 cropped from the 1080x1920 display frame), creates no reels,
      and does not describe the source as 1920x1080 landscape footage.
